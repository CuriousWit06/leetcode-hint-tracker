<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCode Hint Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0A0A0F;
      --surface:   #1A1A2E;
      --elevated:  #16213E;
      --border:    #2A2A4A;
      --text:      #E2E8F0;
      --muted:     #94A3B8;
      --accent:    #6366F1;
      --accent-dim:#3730A3;
      --easy:      #22C55E;
      --medium:    #F59E0B;
      --hard:      #EF4444;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .logo {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .logo span { color: var(--accent); }

    .header-actions { display: flex; gap: 0.75rem; align-items: center; }

    .btn {
      font-family: var(--sans);
      font-size: 0.8125rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }

    .btn-accent {
      background: var(--accent);
      color: #fff;
    }

    .btn-accent:hover:not(:disabled) { opacity: 0.85; }

    .sync-status {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* ── Layout ── */
    main { max-width: 900px; margin: 0 auto; padding: 2rem; }

    /* ── View transitions ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── List view ── */
    .list-header {
      margin-bottom: 1.5rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    .list-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .problem-count {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .problem-list { display: flex; flex-direction: column; gap: 0.5rem; }

    .problem-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: center;
    }

    .problem-card:hover {
      border-color: var(--accent);
      background: var(--elevated);
    }

    .problem-card-left { min-width: 0; }

    .problem-title {
      font-family: var(--mono);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.5rem;
    }

    .problem-meta { display: flex; align-items: center; gap: 0.75rem; }

    .difficulty-badge {
      font-size: 0.6875rem;
      font-weight: 600;
      font-family: var(--mono);
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .difficulty-badge.easy  { background: #052e1640; color: var(--easy);   border: 1px solid #052e1680; }
    .difficulty-badge.medium{ background: #451a0340; color: var(--medium); border: 1px solid #451a0380; }
    .difficulty-badge.hard  { background: #450a0a40; color: var(--hard);   border: 1px solid #450a0a80; }

    /* Priority score bar — the signature element */
    .score-bar-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
      min-width: 100px;
    }

    .score-value {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .score-bar-track {
      width: 100px;
      height: 3px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* ── Problem / Hint view ── */
    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 0.875rem;
      cursor: pointer;
      padding: 0;
      margin-bottom: 1.75rem;
      transition: color 0.15s;
    }

    .back-btn:hover { color: var(--text); }

    .problem-header { margin-bottom: 2rem; }

    .problem-header-slug {
      font-family: var(--mono);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .problem-header-meta { display: flex; align-items: center; gap: 1rem; }

    .lc-link {
      font-size: 0.8125rem;
      color: var(--accent);
      text-decoration: none;
      font-family: var(--mono);
    }

    .lc-link:hover { text-decoration: underline; }

    .score-display {
      font-family: var(--mono);
      font-size: 0.8125rem;
      color: var(--muted);
    }

    /* Hint section */
    .hint-section { margin-top: 2rem; }

    .hint-section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
      font-family: var(--mono);
    }

    .hints-list { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem; }

    .hint-bubble {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 0.875rem 1rem;
      font-size: 0.875rem;
      line-height: 1.6;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hint-level-label {
      font-family: var(--mono);
      font-size: 0.6875rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hint-loading {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.875rem;
      padding: 0.75rem 0;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hint-actions { display: flex; align-items: center; gap: 0.75rem; }

    .hint-exhausted {
      font-size: 0.8125rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* ── Empty / Error states ── */
    .state-empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    .state-empty h2 {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .state-empty p { font-size: 0.875rem; }

    /* ── Loading skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--elevated) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer { to { background-position: -200% 0; } }

    .skeleton-card {
      height: 72px;
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
      max-width: 320px;
    }

    #toast.visible { opacity: 1; transform: translateY(0); }
    #toast.error { border-color: var(--hard); color: var(--hard); }
    #toast.success { border-color: var(--easy); color: var(--easy); }
  </style>
</head>
<body>

<header>
  <div class="logo">lc<span>.</span>review</div>
  <div class="header-actions">
    <span class="sync-status" id="syncStatus"></span>
    <button class="btn btn-ghost" id="syncBtn" onclick="triggerSync()">Sync</button>
  </div>
</header>

<main>
  <!-- List view -->
  <div class="view active" id="listView">
    <div class="list-header">
      <h1>Due for Review</h1>
      <span class="problem-count" id="problemCount"></span>
    </div>
    <div class="problem-list" id="problemList">
      <!-- skeletons while loading -->
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </div>

  <!-- Problem / Hint view -->
  <div class="view" id="problemView">
    <button class="back-btn" onclick="showList()">
      ← Back to list
    </button>
    <div class="problem-header">
      <div class="problem-header-slug" id="viewTitle"></div>
      <div class="problem-header-meta">
        <span class="difficulty-badge" id="viewDifficulty"></span>
        <a class="lc-link" id="viewLink" href="#" target="_blank" rel="noopener">Open on LeetCode ↗</a>
        <span class="score-display" id="viewScore"></span>
      </div>
    </div>

    <div class="hint-section">
      <div class="hint-section-label">Hints</div>
      <div class="hints-list" id="hintsList"></div>
      <div class="hint-actions">
        <button class="btn btn-accent" id="hintBtn" onclick="requestHint()">Get hint</button>
        <span class="hint-exhausted" id="hintExhausted" style="display:none">No more hints available.</span>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  const API = 'https://leetcode-hint-tracker.onrender.com';  // same origin — FastAPI serves this file and the API

  // ── State ───────────────────────────────────────────────────────────────────
  let problems       = [];
  let activeProblem  = null;
  let previousHints  = [];
  let hintLevel      = 0;
  const MAX_HINTS    = 4;

  // ── Boot ────────────────────────────────────────────────────────────────────
  loadProblems();

  async function loadProblems() {
    try {
      const res  = await fetch(`${API}/problems/due`);
      if (!res.ok) throw new Error('Failed to load problems');
      problems   = await res.json();

      const maxScore = problems.length ? problems[0][2] : 1;
      renderList(problems, maxScore);
      document.getElementById('problemCount').textContent =
        `${problems.length} problem${problems.length !== 1 ? 's' : ''}`;
    } catch (e) {
      document.getElementById('problemList').innerHTML = `
        <div class="state-empty">
          <h2>Could not load problems</h2>
          <p>Make sure the API server is running and you've synced at least once.</p>
        </div>`;
    }
  }

  // ── Render list ─────────────────────────────────────────────────────────────
  function renderList(problems, maxScore) {
    const container = document.getElementById('problemList');
    if (!problems.length) {
      container.innerHTML = `
        <div class="state-empty">
          <h2>Nothing due yet</h2>
          <p>Sync your LeetCode data to get started.</p>
        </div>`;
      return;
    }

    container.innerHTML = problems.map((p, i) => {
      const [slug, title, score] = p;
      const difficulty           = getDifficulty(problems, i);
      const diffClass            = difficulty.toLowerCase();
      const barColor             = { easy: 'var(--easy)', medium: 'var(--medium)', hard: 'var(--hard)' }[diffClass] || 'var(--accent)';
      const barWidth             = Math.round((score / maxScore) * 100);

      return `
        <div class="problem-card" onclick="openProblem(${i})">
          <div class="problem-card-left">
            <div class="problem-title">${title}</div>
            <div class="problem-meta">
              <span class="difficulty-badge ${diffClass}">${difficulty}</span>
            </div>
          </div>
          <div class="score-bar-wrap">
            <span class="score-value">${score.toFixed(1)}</span>
            <div class="score-bar-track">
              <div class="score-bar-fill" style="width:${barWidth}%; background:${barColor}"></div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // difficulty isn't in the ranked list directly — look it up from the full list
  // the API returns [slug, title, score]; we stored difficulty separately below
  function getDifficulty(problems, index) {
    // fallback — difficulty stored on card data if available
    return problems[index][3] || '';
  }

  // ── Open problem ─────────────────────────────────────────────────────────────
  function openProblem(index) {
    activeProblem = problems[index];
    previousHints = [];
    hintLevel     = 0;

    const [slug, title, score] = activeProblem;
    const difficulty           = activeProblem[3] || '';
    const diffClass            = difficulty.toLowerCase();

    document.getElementById('viewTitle').textContent      = title;
    document.getElementById('viewDifficulty').textContent = difficulty;
    document.getElementById('viewDifficulty').className   = `difficulty-badge ${diffClass}`;
    document.getElementById('viewLink').href              = `https://leetcode.com/problems/${slug}/`;
    document.getElementById('viewScore').textContent      = `score ${score.toFixed(1)}`;
    document.getElementById('hintsList').innerHTML        = '';
    document.getElementById('hintBtn').style.display      = '';
    document.getElementById('hintExhausted').style.display = 'none';
    document.getElementById('hintBtn').disabled           = false;

    showView('problemView');
  }

  // ── Hints ────────────────────────────────────────────────────────────────────
  async function requestHint() {
    if (!activeProblem || hintLevel >= MAX_HINTS) return;

    hintLevel++;
    const btn  = document.getElementById('hintBtn');
    btn.disabled = true;

    // show loading indicator
    const loadingEl = document.createElement('div');
    loadingEl.className = 'hint-loading';
    loadingEl.innerHTML = `<div class="spinner"></div> Thinking…`;
    document.getElementById('hintsList').appendChild(loadingEl);

    try {
      const res = await fetch(`${API}/hint`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          title_slug:     activeProblem[0],
          level:          hintLevel,
          previous_hints: previousHints,
        }),
      });

      if (!res.ok) throw new Error('Hint request failed');
      const hintText = await res.json();

      loadingEl.remove();
      previousHints.push(hintText);
      appendHint(hintLevel, hintText);

      if (hintLevel >= MAX_HINTS) {
        btn.style.display = 'none';
        document.getElementById('hintExhausted').style.display = '';
      } else {
        btn.disabled = false;
        btn.textContent = `Hint ${hintLevel + 1}`;
      }
    } catch (e) {
      loadingEl.remove();
      hintLevel--;
      btn.disabled = false;
      showToast('Could not fetch hint. Try again.', 'error');
    }
  }

  function appendHint(level, text) {
    const el       = document.createElement('div');
    el.className   = 'hint-bubble';
    el.innerHTML   = `
      <div class="hint-level-label">Hint ${level}</div>
      <div>${escapeHtml(text)}</div>`;
    document.getElementById('hintsList').appendChild(el);
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ── Sync ─────────────────────────────────────────────────────────────────────
  async function triggerSync() {
    const btn    = document.getElementById('syncBtn');
    const status = document.getElementById('syncStatus');
    btn.disabled = true;
    status.textContent = 'syncing…';

    try {
      const res = await fetch(`${API}/initialise`, { method: 'POST' });
      if (!res.ok) throw new Error();
      status.textContent = 'synced';
      showToast('Sync complete. Reloading problems…', 'success');
      setTimeout(() => { status.textContent = ''; loadProblems(); }, 1500);
    } catch {
      status.textContent = '';
      showToast('Sync failed. Check your session cookie.', 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ── View helpers ─────────────────────────────────────────────────────────────
  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showList() { showView('listView'); }

  // ── Toast ────────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent  = msg;
    t.className    = `visible ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, 3500);
  }

  // ── Utils ────────────────────────────────────────────────────────────────────
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
